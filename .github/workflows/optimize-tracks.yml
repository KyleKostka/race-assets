name: Optimize circuit meshes

# Manually dispatched: downloads the z_tracks.zip source meshes from the
# race3 release, runs gltf-transform optimize on each circuit, and commits
# the optimized .glb files into tracks/ on the default branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-tracks.yml'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gltf-transform CLI
        run: npm install -g @gltf-transform/cli@4.4.2

      - name: Download source meshes from race3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download race3 -p z_tracks.zip -R "$GITHUB_REPOSITORY"
          unzip -o z_tracks.zip
          echo "--- extracted source ---"
          ls -la z_tracks

      - name: Optimize circuits
        run: |
          set -euo pipefail
          # --prune-solid-textures false: keep prune's other cleanup but disable
          # only the sub-behaviour that collapses near-solid textures (shadow
          # gradients, glass, grids) into flat colour factors - which was eating
          # baseColorTexture from surviving materials (Monza shadow_serraglio /
          # physics). Restores them at ZERO size cost (vs --no-prune's ~1.2%).
          OPT="--compress meshopt --texture-compress webp --simplify-error 0.002 --prune-solid-textures false"
          gltf-transform optimize z_tracks/autodromo_nazionale_monza_circuit_2020_layout.glb tracks/monza.glb $OPT --texture-size 1024
          gltf-transform optimize z_tracks/circuit_de_spa-francorchamps_1992_layout.glb tracks/spa.glb $OPT --texture-size 1024
          gltf-transform optimize z_tracks/imola_circuit_2024_layout.glb tracks/imola.glb $OPT --texture-size 1024
          gltf-transform optimize z_tracks/silverstone_circuit_2024_layout.glb tracks/silverstone.glb $OPT --texture-size 1024
          gltf-transform optimize z_tracks/barcelona-catalunya_grand_prix_2023_layout.glb tracks/barcelona.glb $OPT --texture-size 2048
          gltf-transform optimize z_tracks/marina_bay_street_circuit.glb tracks/singapore.glb $OPT --texture-size 2048
          gltf-transform optimize z_tracks/shanghai_international_circuit_2018_layout.glb tracks/shanghai.glb $OPT --texture-size 2048
          echo "--- optimized outputs ---"
          ls -la tracks/*.glb

      - name: Texture-parity gate
        run: |
          set -euo pipefail
          npm install --no-save @gltf-transform/core@4.4.2 @gltf-transform/extensions@4.4.2 meshoptimizer
          node .github/scripts/texture-parity.mjs \
            "z_tracks/autodromo_nazionale_monza_circuit_2020_layout.glb::tracks/monza.glb" \
            "z_tracks/circuit_de_spa-francorchamps_1992_layout.glb::tracks/spa.glb" \
            "z_tracks/imola_circuit_2024_layout.glb::tracks/imola.glb" \
            "z_tracks/silverstone_circuit_2024_layout.glb::tracks/silverstone.glb" \
            "z_tracks/barcelona-catalunya_grand_prix_2023_layout.glb::tracks/barcelona.glb" \
            "z_tracks/marina_bay_street_circuit.glb::tracks/singapore.glb" \
            "z_tracks/shanghai_international_circuit_2018_layout.glb::tracks/shanghai.glb"

      - name: Commit optimized meshes
        run: |
          set -euo pipefail
          rm -rf z_tracks z_tracks.zip
          git config user.name "Kyle Kostka"
          git config user.email "kostka.kyle@gmail.com"
          git add tracks/*.glb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add optimized circuit meshes"
            git push
          fi

# retrigger: run 2

# retrigger: run 3 (public)

# retrigger: run 4 (4 new circuits: barcelona, singapore, nurburgring, shanghai)

# retrigger: run 5 (fix dropped textures: --no-prune + survivor-only parity gate; drop nurburgring)

# retrigger: run 6 (--prune-solid-textures false: same fix at zero size cost; rebuild all meshes)
