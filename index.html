<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Grid of Legends</title>
<style>
  :root{ --panel: rgba(12,14,22,.82); --accent:#e10600; --txt:#f2f3f7; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0c12;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--txt)}
  #app{position:fixed;inset:0}
  canvas#gl{display:block;width:100%;height:100%}

  .hud{position:absolute;pointer-events:none;user-select:none}

  /* position tower */
  #tower{left:14px;top:14px;width:186px;background:var(--panel);border-radius:10px;padding:8px 0;backdrop-filter:blur(6px);font-size:12.5px}
  #tower .hd{display:flex;justify-content:space-between;padding:2px 12px 7px;font-weight:700;letter-spacing:.08em;font-size:11px;color:#aab}
  #tower .row{display:flex;align-items:center;gap:8px;padding:3px 12px;transition:background .3s}
  #tower .row.flash{background:rgba(255,255,255,.14)}
  #tower .pos{width:16px;text-align:right;font-weight:700;color:#99a;font-variant-numeric:tabular-nums}
  #tower .chip{width:5px;height:14px;border-radius:2px;flex:none}
  #tower .tag{font-weight:700;letter-spacing:.04em;flex:1}
  #tower .gap{color:#99a;font-size:11px;font-variant-numeric:tabular-nums}

  /* top center: lap + race name */
  #topbar{top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
  #topbar .box{background:var(--panel);border-radius:10px;padding:8px 16px;text-align:center;backdrop-filter:blur(6px)}
  #topbar .lab{font-size:10px;letter-spacing:.14em;color:#aab;font-weight:700}
  #topbar .val{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  #topbar .val small{font-size:11px;color:#aab;font-weight:600}

  /* minimap */
  #mapwrap{right:14px;top:14px;background:var(--panel);border-radius:10px;padding:8px;backdrop-filter:blur(6px)}
  #map{display:block;width:158px;height:158px}

  /* camera label */
  #camlabel{right:14px;bottom:14px;background:var(--panel);border-radius:8px;padding:6px 12px;font-size:11px;letter-spacing:.1em;font-weight:700;color:#aab}

  /* countdown lights */
  #lights{top:26%;left:50%;transform:translate(-50%,-50%);display:none;gap:12px;background:#14161f;padding:16px 20px;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
  #lights .l{width:34px;height:34px;border-radius:50%;background:#2a2d38;transition:background .1s}
  #lights .l.on{background:var(--accent);box-shadow:0 0 18px var(--accent)}

  /* results */
  #results{inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.72);pointer-events:auto}
  #results .card{width:min(400px,92vw);background:#14161f;border-radius:14px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.6)}
  #results .cardhd{padding:16px 20px;background:linear-gradient(120deg,#e10600,#7d0f2b);font-weight:800;letter-spacing:.06em}
  #results .cardhd small{display:block;font-weight:600;font-size:11px;opacity:.85;letter-spacing:.12em}
  #results .rrow{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:14px;border-top:1px solid rgba(255,255,255,.05)}
  #results .rrow .pos{width:22px;font-weight:800;color:#99a}
  #results .rrow:nth-child(1) .pos{color:#ffd24a}
  #results .rrow .chip{width:6px;height:16px;border-radius:2px}
  #results .rrow .tag{flex:1;font-weight:700}
  #results .rrow .t{color:#99a;font-size:12px;font-variant-numeric:tabular-nums}
  #results .btns{display:flex;gap:10px;padding:16px 20px}

  .btn{pointer-events:auto;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:13px;color:#fff;background:#272b38;flex:1;letter-spacing:.03em}
  .btn.primary{background:var(--accent)}
  .btn:hover{filter:brightness(1.15)}

  #ctl{left:14px;bottom:14px;display:flex;gap:8px}
  #trackbtns{display:flex;gap:8px;margin-left:10px}
  #ctl .btn.active{outline:2px solid var(--accent)}
  #credit{left:50%;transform:translateX(-50%);bottom:8px;font-size:10px;color:#aab;opacity:.8}
  #ctl .btn{flex:none;padding:8px 14px;background:var(--panel);backdrop-filter:blur(6px)}
  #trackSel{pointer-events:auto;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;color:#fff;background:var(--panel);backdrop-filter:blur(6px);letter-spacing:.03em}
  #tower .tyre{width:12px;font-weight:800;font-size:10px;text-align:center;flex:none}

  #loading{inset:0;display:flex;align-items:center;justify-content:center;background:#0a0c12;font-weight:700;letter-spacing:.2em;color:#667;z-index:50}
  @media (max-width:640px){ #tower{width:150px;font-size:11px} #map{width:110px;height:110px} }

  /* betting */
  #betpanel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,14,.82);z-index:60;pointer-events:auto;backdrop-filter:blur(3px)}
  #betpanel .card{width:min(560px,94vw);max-height:92vh;display:flex;flex-direction:column;background:#141822;border-radius:16px;overflow:hidden;box-shadow:0 24px 90px rgba(0,0,0,.7)}
  #betpanel .hd{padding:16px 20px;background:linear-gradient(120deg,#0f8a4a,#0b5f7a);display:flex;justify-content:space-between;align-items:center}
  #betpanel .hd b{font-size:17px;letter-spacing:.05em}
  #betpanel .hd small{display:block;font-size:10.5px;opacity:.85;letter-spacing:.14em;font-weight:700}
  #betrows{overflow-y:auto;flex:1}
  .betrow{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:14px;cursor:pointer;border-top:1px solid rgba(255,255,255,.05)}
  .betrow:hover{background:rgba(255,255,255,.06)}
  .betrow.sel{background:rgba(24,190,110,.22);box-shadow:inset 3px 0 0 #18be6e}
  .betrow .bpos{width:30px;color:#8a93a6;font-weight:800;font-size:11.5px}
  .betrow .chip{width:5px;height:16px;border-radius:2px;flex:none}
  .betrow .bname{flex:1;font-weight:700}
  .betrow .btyre{width:16px;font-weight:900;font-size:11px;text-align:center}
  .betrow .bodds{width:62px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:#ffd24a}
  #betchips{display:flex;gap:8px;padding:12px 18px 4px}
  .chip2{flex:1;padding:9px 0;border-radius:9px;background:#222836;text-align:center;font-weight:800;font-size:13px;cursor:pointer;border:2px solid transparent}
  .chip2.on{border-color:#18be6e;background:#17351f;color:#7dffb4}
  #betfoot{padding:12px 18px 16px;display:flex;gap:10px;align-items:center}
  #betfoot .sum{flex:1;font-size:12px;color:#9aa3b4}
  #betfoot .sum b{display:block;font-size:16px;color:#f2f3f7}
  #betgo{padding:12px 22px;border:0;border-radius:10px;font-weight:800;font-size:14px;color:#04140b;background:#18be6e;cursor:pointer}
  #betgo:disabled{background:#2a3040;color:#69728a;cursor:not-allowed}
  #betskip{padding:12px 16px;border:0;border-radius:10px;font-weight:700;font-size:13px;color:#cfd6e4;background:#242b3a;cursor:pointer}
  #bal{position:absolute;z-index:70;top:82px;left:50%;transform:translate(-104px,0);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px;color:#7dffb4;backdrop-filter:blur(6px)}
  #betres{display:none;margin:0 20px 4px;padding:10px 14px;border-radius:10px;font-weight:800;font-size:14px;text-align:center}
  #betres.win{background:#17351f;color:#7dffb4}
  #betres.lose{background:#3a1d21;color:#ff9c9c}

  #lbtoggle{position:absolute;z-index:70;top:82px;left:50%;transform:translate(4px,0);background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;color:#ffd24a;cursor:pointer;pointer-events:auto;backdrop-filter:blur(6px)}
  #lbpanel{position:absolute;z-index:70;top:124px;left:50%;transform:translate(-150px,0);width:300px;display:none;background:var(--panel);border-radius:12px;padding:10px 0 6px;backdrop-filter:blur(8px);pointer-events:auto;z-index:40}
  #lbpanel .lbhd{display:flex;justify-content:space-between;align-items:center;padding:2px 14px 8px;font-size:10.5px;letter-spacing:.14em;color:#8a93a6;font-weight:800}
  #lbclose{cursor:pointer;color:#cfd6e4}
  .lbrow{display:flex;gap:8px;align-items:center;padding:5px 14px;font-size:12.5px}
  .lbrow.me{background:rgba(24,190,110,.16)}
  .lbrow .lbp{width:16px;color:#8a93a6;font-weight:800}
  .lbrow .lbn{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lbrow .lbw{color:#8a93a6;font-size:11px}
  .lbrow .lbb{font-weight:800;color:#7dffb4;font-variant-numeric:tabular-nums}
  #lbme{cursor:pointer;color:#ffd24a;text-decoration:underline dotted}

  /* main menu */
  #menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#16243a,#070a12 70%);z-index:80;pointer-events:auto}
  #menu .mcard{width:min(620px,94vw);max-height:94vh;overflow-y:auto;text-align:center;padding:26px 22px 22px}
  #menu h1{font-size:34px;letter-spacing:.16em;font-weight:900;margin-bottom:4px;background:linear-gradient(92deg,#ffd24a,#ff6a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
  #menu .sub{font-size:11px;letter-spacing:.28em;color:#7f8ba3;font-weight:700;margin-bottom:22px}
  #tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .tcard{background:#171d29;border:2px solid transparent;border-radius:12px;padding:14px 8px;cursor:pointer;transition:.15s}
  .tcard:hover{background:#1e2635}
  .tcard.sel{border-color:#ffd24a;background:#241f14}
  .tcard .tn{font-weight:800;font-size:13.5px;letter-spacing:.05em}
  .tcard .tl{font-size:10.5px;color:#8a93a6;margin-top:3px;font-variant-numeric:tabular-nums}
  .tcard.dim{opacity:.45}
  #mrow{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:14px}
  .mbtn{padding:11px 18px;border:0;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;background:#242b3a;color:#dfe5f0}
  .mbtn.go{background:#18be6e;color:#04140b;padding:13px 30px;font-size:15px}
  #mlaps{background:#171d29;color:#dfe5f0;border:0;border-radius:10px;padding:11px 12px;font-weight:700;font-size:13px}
  #menu .mfoot{font-size:11px;color:#6f7a90;margin-top:14px;line-height:1.7}
  #menu .mbal{color:#7dffb4;font-weight:800}
  /* outro */
  #outro .card{width:min(520px,94vw)}
  #outro .cardhd{background:linear-gradient(120deg,#0f8a4a,#0b5f7a)}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div class="hud" id="loading">LOADING CIRCUIT…</div>
  <div class="hud" id="tower"><div class="hd"><span id="trackname">SUZUKA</span><span id="racename">GP</span></div><div id="towerrows"></div></div>
  <div class="hud" id="topbar">
    <div class="box"><div class="lab">LAP</div><div class="val" id="lapval">1<small>/13</small></div></div>
    <div class="box"><div class="lab">LEADER</div><div class="val" id="leadval">—</div></div>
    <div class="box"><div class="lab">SPEED</div><div class="val" id="spdval">0<small> mph</small></div></div>
  </div>
  <div class="hud" id="mapwrap"><canvas id="map" width="316" height="316"></canvas></div>
  <div class="hud" id="camlabel">CAM · —</div>
  <div class="hud" id="lights" style="display:none"><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div></div>
  <div class="hud" id="ctl">
    <button class="btn" id="btnNew">NEW RACE</button>
    <button class="btn" id="btnReplay">REPLAY</button>
    <select id="trackSel" class="btn"><option value="monza">MONZA</option><option value="spa">SPA</option><option value="imola">IMOLA</option><option value="silverstone">SILVERSTONE</option><option value="suzuka">SUZUKA</option><option value="oval">OVAL</option></select>
  </div>
  <div class="hud" id="credit"></div>
  <div id="menu"><div class="mcard">
  <h1>GRID OF LEGENDS</h1><div class="sub">PICK A CIRCUIT &middot; PLACE YOUR BET &middot; WATCH IT UNFOLD</div>
  <div id="tgrid"></div>
  <div id="mrow">
    <button class="mbtn" id="mrand">🎲 RANDOM TRACK</button>
    <select id="mlaps"><option value="5">5 laps</option><option value="9">9 laps</option><option value="13" selected>13 laps</option><option value="20">20 laps</option></select>
  </div>
  <button class="mbtn go" id="mgo">START RACE WEEKEND</button>
  <div class="mfoot">bankroll <span class="mbal" id="mbal">$1,000</span> &middot; <span id="mname" style="cursor:pointer;text-decoration:underline dotted;color:#ffd24a">set name</span></div>
</div></div>
<div id="betpanel"><div class="card">
  <div class="hd"><div><small>PLACE YOUR BET</small><b id="bettrack">—</b></div><div style="text-align:right"><small>BALANCE</small><b id="betbal">$1,000</b></div></div>
  <div id="betrows"></div>
  <div id="betchips"><div class="chip2" data-v="25">$25</div><div class="chip2" data-v="50">$50</div><div class="chip2" data-v="100">$100</div><div class="chip2" data-v="250">$250</div><div class="chip2" data-v="500">$500</div></div>
  <div id="betfoot"><div class="sum">stake <b id="betstake">$0</b><span id="betret">—</span></div>
  <button id="betskip">NO BET</button><button id="betgo" disabled>PLACE BET</button></div>
</div></div>
<div class="hud" id="lbtoggle">🏆 LEADERBOARD</div>
<div id="lbpanel"><div class="lbhd"><span>TOP BANKROLLS &middot; <span id="lbme">set name</span></span><span id="lbclose">✕</span></div><div id="lbrows"></div></div>
<div class="hud" id="bal">$1,000</div>
<div class="hud" id="results"><div class="card">
    <div class="cardhd"><small>RACE RESULT</small>RACE RESULT</div>
    <div id="betres"></div><div id="resrows"></div>
    <div class="btns"><button class="btn" id="btnMenu2">NEW TRACK</button><button class="btn" id="btnReplay2">REPLAY</button><button class="btn primary" id="btnNew2">NEW RACE</button></div>
  </div></div>
</div>

<script type="importmap">

</script>
<script type="module" src="game.js"></script>
</body>
</html>
