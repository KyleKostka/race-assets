<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Monaco GP — Race Replay</title>
<style>
  :root{ --panel: rgba(12,14,22,.82); --accent:#e10600; --txt:#f2f3f7; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0c12;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--txt)}
  #app{position:fixed;inset:0}
  canvas#gl{display:block;width:100%;height:100%}

  .hud{position:absolute;pointer-events:none;user-select:none}

  /* position tower */
  #tower{left:14px;top:14px;width:186px;background:var(--panel);border-radius:10px;padding:8px 0;backdrop-filter:blur(6px);font-size:12.5px}
  #tower .hd{display:flex;justify-content:space-between;padding:2px 12px 7px;font-weight:700;letter-spacing:.08em;font-size:11px;color:#aab}
  #tower .row{display:flex;align-items:center;gap:8px;padding:3px 12px;transition:background .3s}
  #tower .row.flash{background:rgba(255,255,255,.14)}
  #tower .pos{width:16px;text-align:right;font-weight:700;color:#99a;font-variant-numeric:tabular-nums}
  #tower .chip{width:5px;height:14px;border-radius:2px;flex:none}
  #tower .tag{font-weight:700;letter-spacing:.04em;flex:1}
  #tower .gap{color:#99a;font-size:11px;font-variant-numeric:tabular-nums}

  /* top center: lap + race name */
  #topbar{top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
  #topbar .box{background:var(--panel);border-radius:10px;padding:8px 16px;text-align:center;backdrop-filter:blur(6px)}
  #topbar .lab{font-size:10px;letter-spacing:.14em;color:#aab;font-weight:700}
  #topbar .val{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  #topbar .val small{font-size:11px;color:#aab;font-weight:600}

  /* minimap */
  #mapwrap{right:14px;top:14px;background:var(--panel);border-radius:10px;padding:8px;backdrop-filter:blur(6px)}
  #map{display:block;width:158px;height:158px}

  /* camera label */
  #camlabel{right:14px;bottom:14px;background:var(--panel);border-radius:8px;padding:6px 12px;font-size:11px;letter-spacing:.1em;font-weight:700;color:#aab}

  /* countdown lights */
  #lights{top:26%;left:50%;transform:translate(-50%,-50%);display:none;gap:12px;background:#14161f;padding:16px 20px;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
  #lights .l{width:34px;height:34px;border-radius:50%;background:#2a2d38;transition:background .1s}
  #lights .l.on{background:var(--accent);box-shadow:0 0 18px var(--accent)}

  /* results */
  #results{inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.72);pointer-events:auto}
  #results .card{width:min(400px,92vw);background:#14161f;border-radius:14px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.6)}
  #results .cardhd{padding:16px 20px;background:linear-gradient(120deg,#e10600,#7d0f2b);font-weight:800;letter-spacing:.06em}
  #results .cardhd small{display:block;font-weight:600;font-size:11px;opacity:.85;letter-spacing:.12em}
  #results .rrow{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:14px;border-top:1px solid rgba(255,255,255,.05)}
  #results .rrow .pos{width:22px;font-weight:800;color:#99a}
  #results .rrow:nth-child(1) .pos{color:#ffd24a}
  #results .rrow .chip{width:6px;height:16px;border-radius:2px}
  #results .rrow .tag{flex:1;font-weight:700}
  #results .rrow .t{color:#99a;font-size:12px;font-variant-numeric:tabular-nums}
  #results .btns{display:flex;gap:10px;padding:16px 20px}

  .btn{pointer-events:auto;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:13px;color:#fff;background:#272b38;flex:1;letter-spacing:.03em}
  .btn.primary{background:var(--accent)}
  .btn:hover{filter:brightness(1.15)}

  #ctl{left:14px;bottom:14px;display:flex;gap:8px}
  #trackbtns{display:flex;gap:8px;margin-left:10px}
  #ctl .btn.active{outline:2px solid var(--accent)}
  #credit{left:50%;transform:translateX(-50%);bottom:8px;font-size:10px;color:#aab;opacity:.8}
  #ctl .btn{flex:none;padding:8px 14px;background:var(--panel);backdrop-filter:blur(6px)}

  #loading{inset:0;display:flex;align-items:center;justify-content:center;background:#0a0c12;font-weight:700;letter-spacing:.2em;color:#667;z-index:50}
  @media (max-width:640px){ #tower{width:150px;font-size:11px} #map{width:110px;height:110px} }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div class="hud" id="loading">LOADING CIRCUIT…</div>
  <div class="hud" id="tower"><div class="hd"><span id="trackname">SUZUKA</span><span id="racename">GP</span></div><div id="towerrows"></div></div>
  <div class="hud" id="topbar">
    <div class="box"><div class="lab">LAP</div><div class="val" id="lapval">1<small>/5</small></div></div>
    <div class="box"><div class="lab">LEADER</div><div class="val" id="leadval">—</div></div>
    <div class="box"><div class="lab">SPEED</div><div class="val" id="spdval">0<small> mph</small></div></div>
  </div>
  <div class="hud" id="mapwrap"><canvas id="map" width="316" height="316"></canvas></div>
  <div class="hud" id="camlabel">CAM · —</div>
  <div class="hud" id="lights" style="display:none"><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div></div>
  <div class="hud" id="ctl">
    <button class="btn" id="btnNew">NEW RACE</button>
    <button class="btn" id="btnReplay">REPLAY</button>
    <span id="trackbtns"><button class="btn" data-track="suzuka">SUZUKA</button><button class="btn" data-track="monaco">MONACO</button></span>
  </div>
  <div class="hud" id="credit"></div>
  <div class="hud" id="results"><div class="card">
    <div class="cardhd"><small>RACE RESULT</small>RACE RESULT</div>
    <div id="resrows"></div>
    <div class="btns"><button class="btn" id="btnReplay2">WATCH AGAIN</button><button class="btn primary" id="btnNew2">NEW RACE</button></div>
  </div></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module" src="game.js"></script>
</body>
</html>
